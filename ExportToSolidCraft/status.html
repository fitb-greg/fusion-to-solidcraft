<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 12px; color: #222; background: #f7f7f7; }
  h1 { font-size: 14px; margin: 0 0 8px; word-break: break-all; }
  #phase { margin-bottom: 6px; color: #444; min-height: 1.3em; }
  .bar { height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #2f7de1; transition: width .2s; }
  .counts { display: flex; gap: 14px; margin: 10px 0; }
  .counts b { font-size: 16px; display: block; }
  .kept b { color: #1d8a3a; } .fusion b { color: #b06d00; } .failed b { color: #c62828; }
  #log { background: #fff; border: 1px solid #ddd; border-radius: 4px; height: 220px; overflow-y: auto; padding: 4px 6px; font-size: 12px; }
  #log div { padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
  #log .fusion { color: #8a5600; } #log .failed { color: #c62828; } #log .note { color: #666; }
  #summary { margin: 10px 0; white-space: pre-wrap; display: none; }
  .buttons { display: none; gap: 6px; margin-top: 8px; }
  button { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<h1 id="title">Export to SolidCraft</h1>
<div id="phase">Starting…</div>
<div class="bar"><div id="bar"></div></div>
<div class="counts">
  <div class="kept"><b id="kept">–</b>steps kept</div>
  <div class="fusion"><b id="fusion">0</b>from Fusion</div>
  <div class="failed"><b id="failed">0</b>failed</div>
</div>
<div id="summary"></div>
<div id="log"></div>
<div class="buttons" id="buttons">
  <button onclick="send('open')">Open in SolidCraft</button>
  <button onclick="send('report')">Show report</button>
  <button onclick="send('folder')">Show folder</button>
</div>
<script>
  function send(action) { adsk.fusionSendData(action, "{}"); }
  function $(id) { return document.getElementById(id); }
  function show(m) {
    if (m.title !== undefined) $("title").textContent = m.title;
    if (m.phase !== undefined) $("phase").textContent = m.phase;
    if (m.value !== undefined && m.max) $("bar").style.width = (100 * m.value / m.max) + "%";
    ["kept", "fusion", "failed"].forEach(function (k) { if (m[k] !== undefined) $(k).textContent = m[k]; });
    (m.lines || []).forEach(function (l) {
      var d = document.createElement("div");
      d.className = l[0]; d.textContent = l[1];
      $("log").appendChild(d);
      $("log").scrollTop = $("log").scrollHeight;
    });
    if (m.reset) { $("log").innerHTML = ""; $("summary").style.display = "none"; $("buttons").style.display = "none"; }
    if (m.summary) { $("summary").textContent = m.summary; $("summary").style.display = "block"; }
    if (m.done) $("buttons").style.display = "flex";
  }
  window.fusionJavaScriptHandler = {
    handle: function (action, data) {
      heard = true;
      try { if (action === "show") show(JSON.parse(data)); } catch (e) { return "error " + e; }
      return "OK";
    }
  };
  // Fusion's bridge to the page can come up after the page has loaded: say "ready" until the
  // add-in answers.
  var heard = false;
  (function ready() {
    if (heard) return;
    try { if (window.adsk && adsk.fusionSendData) send("ready"); } catch (e) {}
    setTimeout(ready, 250);
  })();
</script>
</body>
</html>
